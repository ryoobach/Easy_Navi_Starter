name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app identity and version
        id: app
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          APPLICATION_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          test -n "$VERSION_CODE" || (echo "Could not read versionCode" && exit 1)
          test "$APPLICATION_ID" = "com.ryoobach.easynavistarter" || (echo "Unexpected applicationId: $APPLICATION_ID" && exit 1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"

      - name: Restore persistent debug signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-navi-starter-debug-signing-key-v1

      - name: Create debug signing key on first build only
        if: steps.debug-key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify persistent signing key
        shell: bash
        run: |
          test -s ~/.android/debug.keystore
          KEYSTORE_SHA256="$(keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$KEYSTORE_SHA256"
          echo "EXPECTED_SIGNING_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"

      - name: Apply repository app and collaboration icons
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          test -s app_icon.png
          test -s js_logo.png
          cp app_icon.png app/src/main/res/drawable-nodpi/easy_navi_launcher.png
          cp js_logo.png app/src/main/res/drawable-nodpi/js_logo.png

      - name: Build signed APK
        run: gradle assembleRelease

      - name: Verify APK identity, version, and signature
        id: verify
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || (echo "APK was not created" && exit 1)
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ACTUAL_ID="$("$APKANALYZER" manifest application-id "$APK")"
          ACTUAL_VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          ACTUAL_VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          test "$ACTUAL_ID" = "${{ steps.app.outputs.application_id }}"
          test "$ACTUAL_VERSION_NAME" = "${{ steps.app.outputs.version_name }}"
          test "$ACTUAL_VERSION_CODE" = "${{ steps.app.outputs.version_code }}"
          SIGNER_SHA256="$("$APKSIGNER" verify --verbose --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$SIGNER_SHA256"
          test "$SIGNER_SHA256" = "$EXPECTED_SIGNING_SHA256" || (echo "APK certificate does not match persistent release key" && exit 1)
          echo "version_name=$ACTUAL_VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Package versioned APK
        env:
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Easy-Navi-Starter-v${VERSION_NAME}-release.apk"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Navi-Starter-v${{ steps.verify.outputs.version_name }}-release
          path: dist/Easy-Navi-Starter-v${{ steps.verify.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 30
