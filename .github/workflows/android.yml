name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read app identity and version
        id: app
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          APPLICATION_ID="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME" || (echo "Could not read versionName" && exit 1)
          test -n "$VERSION_CODE" || (echo "Could not read versionCode" && exit 1)
          test "$APPLICATION_ID" = "com.ryoobach.easynavistarter" || (echo "Unexpected applicationId: $APPLICATION_ID" && exit 1)
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"
          echo "Building $APPLICATION_ID version $VERSION_NAME ($VERSION_CODE)"

      - name: Prepare persistent release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing GitHub secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing GitHub secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing GitHub secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing GitHub secret: ANDROID_KEY_PASSWORD" && exit 1)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easy-navi-release.jks"
          test -s "$RUNNER_TEMP/easy-navi-release.jks" || (echo "Decoded keystore is empty" && exit 1)
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/easy-navi-release.jks" >> "$GITHUB_ENV"
          KEYSTORE_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/easy-navi-release.jks" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$KEYSTORE_SHA256" || (echo "Could not read signing certificate fingerprint" && exit 1)
          echo "EXPECTED_SIGNING_SHA256=$KEYSTORE_SHA256" >> "$GITHUB_ENV"
          echo "Persistent release signing certificate loaded."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK identity, version, and signing certificate
        id: verify
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || (echo "Release APK was not created" && exit 1)

          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ACTUAL_ID="$("$APKANALYZER" manifest application-id "$APK")"
          ACTUAL_VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          ACTUAL_VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          test "$ACTUAL_ID" = "${{ steps.app.outputs.application_id }}" || (echo "applicationId mismatch: $ACTUAL_ID" && exit 1)
          test "$ACTUAL_VERSION_NAME" = "${{ steps.app.outputs.version_name }}" || (echo "versionName mismatch: $ACTUAL_VERSION_NAME" && exit 1)
          test "$ACTUAL_VERSION_CODE" = "${{ steps.app.outputs.version_code }}" || (echo "versionCode mismatch: $ACTUAL_VERSION_CODE" && exit 1)

          SIGNER_SHA256="$("$APKSIGNER" verify --verbose --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test -n "$SIGNER_SHA256" || (echo "APK signing certificate could not be read" && exit 1)
          test "$SIGNER_SHA256" = "$EXPECTED_SIGNING_SHA256" || (echo "APK signing certificate does not match the persistent release key" && exit 1)

          echo "APK identity, version, and signing certificate verified."
          echo "version_name=$ACTUAL_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$ACTUAL_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Package versioned APK
        env:
          VERSION_NAME: ${{ steps.verify.outputs.version_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Easy-Navi-Starter-v${VERSION_NAME}-release.apk"

      - name: Upload versioned APK
        uses: actions/upload-artifact@v4
        with:
          name: Easy-Navi-Starter-v${{ steps.verify.outputs.version_name }}-release
          path: dist/Easy-Navi-Starter-v${{ steps.verify.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 30
