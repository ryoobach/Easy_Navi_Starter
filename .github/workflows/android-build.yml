name: Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-navi-starter-debug-signing-key-v1

      - name: Create debug signing key on first build only
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Apply repository app and collaboration icons
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          test -s app_icon.png
          test -s js_logo.png
          cp app_icon.png app/src/main/res/drawable-nodpi/easy_navi_launcher.png
          cp js_logo.png app/src/main/res/drawable-nodpi/js_logo.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-build-cache --rerun-tasks assembleDebug

      - name: Verify APK identity, version, and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          grep -q 'applicationId = "com.ryoobach.easynavistarter"' app/build.gradle.kts
          grep -q 'versionCode = 36' app/build.gradle.kts
          grep -q 'versionName = "0.5.4"' app/build.gradle.kts
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK file exists, Gradle identity/version checked, and APK signature verified."

      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Easy_Navi_Starter_0.5.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy_Navi_Starter_0.5.4
          path: dist/Easy_Navi_Starter_0.4.1.apk
          if-no-files-found: error
          retention-days: 30
