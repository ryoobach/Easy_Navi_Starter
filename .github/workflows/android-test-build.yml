name: Android APK Test Build (Persistent Debug Key)

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-test-build.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Restore persistent debug signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: easy-navi-starter-debug-signing-key-v1

      - name: Create debug signing key on first build only
        if: steps.debug-key-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify persistent debug signing key
        shell: bash
        run: |
          test -s ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:'

      - name: Apply repository app and collaboration icons
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          test -s app_icon.png
          test -s js_logo.png
          cp app_icon.png app/src/main/res/drawable-nodpi/easy_navi_launcher.png
          cp js_logo.png app/src/main/res/drawable-nodpi/js_logo.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-build-cache --rerun-tasks assembleDebug

      - name: Verify APK and signing certificate
        id: verify
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          test "$APP_ID" = "com.ryoobach.easynavistarter"
          CERT_SHA256="$("$APKSIGNER" verify --verbose --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$CERT_SHA256"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "certificate_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "APK verified: $APP_ID $VERSION_NAME ($VERSION_CODE)"
          echo "Signing certificate SHA-256: $CERT_SHA256"

      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Easy_Navi_Starter_${{ steps.verify.outputs.version_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Easy_Navi_Starter_${{ steps.verify.outputs.version_name }}
          path: dist/Easy_Navi_Starter_${{ steps.verify.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30
